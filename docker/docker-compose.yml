services:
  postgres:
    image: postgres:16-alpine
    container_name: jashuva-postgres
    environment:
      POSTGRES_USER: jashuva
      POSTGRES_PASSWORD: jashuva_secret
      POSTGRES_DB: jashuva_games
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jashuva -d jashuva_games"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jashuva-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: jashuva-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://jashuva:jashuva_secret@postgres:5432/jashuva_games?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      TWO_FACTOR_ENFORCE: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: jashuva-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      API_URL: http://api:4000
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
