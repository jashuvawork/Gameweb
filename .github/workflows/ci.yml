name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jashuva
          POSTGRES_PASSWORD: jashuva_secret
          POSTGRES_DB: jashuva_games
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jashuva -d jashuva_games"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager" — do not also set "version" here
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @jashuva/shared build
      - name: Generate Prisma + sync schema
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jashuva:jashuva_secret@localhost:5432/jashuva_games?schema=public
        run: |
          pnpm prisma:generate
          npx prisma db push
      - run: pnpm --filter @jashuva/api test
      - run: pnpm --filter @jashuva/api build
      - run: pnpm --filter @jashuva/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
